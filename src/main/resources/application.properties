# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# FIXED: Strong JWT secret (should be at least 256 bits)
app.jwt.secret=myVerySecretKeyThatIsAtLeast256BitsLongForSecurityPurposesAndShouldBeChangedInProduction
# FIXED: Reasonable token validity (1 hour)
app.jwt.ttl-seconds=3600
# FIXED: JWT issuer and audience for additional security
app.jwt.issuer=owasp-api-lab
app.jwt.audience=api-users

# FIXED: Reduced error detail exposure
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.root=INFO
